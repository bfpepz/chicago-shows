name: Build and deploy
on:
  schedule:
    - cron: "17 10 * * *"   # daily, ~5am Chicago
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Scrape (a venue that fails keeps its previous data)
        run: python scrape.py || echo "scrape failed, using existing data"
      - name: Commit refreshed data (also keeps the schedule alive)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add events.json && git commit -m "Daily data refresh" && git push || echo "no data changes"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
